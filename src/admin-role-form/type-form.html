<h2>{{(vm.roleId ? 'adminRoleForm.updateRole' : 'adminRoleForm.createRole') | message}}</h2>
<div>{{(vm.roleId ? 'adminRoleForm.selectTypeForExistingRole' : 'adminRoleForm.selectType') | message}}</div>
<dl class="type-form">
    <dt ng-repeat-start="(type, rights) in vm.types">
        <button ng-click="vm.selectType(type)">
            {{type | roleType}}
        </button>
    </dt>
    <dd ng-repeat-end>
        {{type | roleType:true}}
    </dd>
</dl>
<div class="openlmis-toolbar">
    <button ui-sref="^">{{'adminRoleForm.cancel' | message}}</button>
</div>
